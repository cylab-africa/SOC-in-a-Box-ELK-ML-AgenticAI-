# Docker Compose for Linux Anomaly Detection
# =============================================
# Usage:
#   docker compose -f docker/docker-compose.yml up
#
# This starts the detection service alongside Elasticsearch and Kibana
# for a complete local development/demo environment.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: anomaly-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -k https://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: anomaly-kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD:-changeme}
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: anomaly-detection
    env_file:
      - ../.env
    environment:
      - ES_HOST=https://elasticsearch:9200
    volumes:
      - ../results:/app/results
      - ../logs:/app/logs
      - ../config:/app/config
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Optional add-on: only starts with `--profile maintenance`.
  siem-maintenance:
    profiles: ["maintenance"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.maintenance
    container_name: siem-maintenance
    env_file:
      # Written by deploy.sh; optional so detection-only setups never need it.
      - path: ../addons/siem-maintenance/.env
        required: false
    environment:
      - ES_HOST=https://elasticsearch:9200
    volumes:
      - ../addons/siem-maintenance/Agent-SIEM-maintenance/results:/app/Agent-SIEM-maintenance/results
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Optional add-on: only starts with `--profile triage`. It has no
  # authentication, so it is published on loopback unless TRIAGE_BIND is set.
  alert-triage:
    profiles: ["triage"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.triage
    container_name: alert-triage
    env_file:
      # Written by deploy.sh; optional so other setups never need it.
      - path: ../addons/alert-triage/.env
        required: false
    environment:
      - ELASTIC_URL=https://elasticsearch:9200
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "${TRIAGE_BIND:-127.0.0.1}:${TRIAGE_PORT:-8000}:8000"
    volumes:
      - ../addons/alert-triage/certs:/app/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es-data:
    driver: local
