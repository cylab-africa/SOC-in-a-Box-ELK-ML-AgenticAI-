name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -x --tb=short
      - name: Compile check all Python files
        run: |
          find . -name "*.py" -not -path "./.claude/*" -not -path "./mlruns/*" | xargs python -m py_compile

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          # Check for common credential patterns
          if grep -rn "password\s*=\s*['\"][^'\"]*['\"]" --include="*.py" . | grep -v "\.env" | grep -v "test_" | grep -v "example"; then
            echo "Potential hardcoded credentials found!"
            exit 1
          fi
          echo "No hardcoded credentials detected"
