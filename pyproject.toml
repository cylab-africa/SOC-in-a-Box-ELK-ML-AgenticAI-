[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-in-a-box"
version = "1.0.0"
description = "SOC-in-a-Box detection engine: MITRE ATT&CK-aligned ML anomaly detection for Linux endpoints on the Elastic Stack"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
    {name = "SOC-in-a-Box contributors"},
]
keywords = [
    "security", "anomaly-detection", "linux", "elasticsearch",
    "mitre-attack", "siem", "threat-detection", "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dl = [
    "torch>=2.0.0",
]
ops = [
    "mlflow>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/cylab-africa/SOC-in-a-Box-ELK-ML-AgenticAI-"
Documentation = "https://github.com/cylab-africa/SOC-in-a-Box-ELK-ML-AgenticAI-/tree/main/docs"
Repository = "https://github.com/cylab-africa/SOC-in-a-Box-ELK-ML-AgenticAI-"
Issues = "https://github.com/cylab-africa/SOC-in-a-Box-ELK-ML-AgenticAI-/issues"

[project.scripts]
linux-anomaly-detect = "main:main"
linux-anomaly-serve = "realtime_service:main"
linux-anomaly-train = "train_models_background:main"
linux-anomaly-push = "push_all_anomalies:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
# The engine's code lives in engine/; its entry points are top-level modules there.
package-dir = {"" = "engine"}
py-modules = [
    "adaptive_threshold", "anomaly_detector", "benign_lists", "config",
    "datamanager", "detection_methods", "entity_alignment", "es_tls",
    "fixedLDS", "main", "model_manager", "post_correlation",
    "push_all_anomalies", "realtime_service", "train_models_background",
    "visualizer",
]

[tool.setuptools.packages.find]
where = ["engine"]
include = [
    "backends*",
    "mappings*",
    "features*",
    "models*",
    "dl_models*",
    "adversarial*",
]

[tool.setuptools.package-data]
mappings = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120
# The engine's modules are first-party for import sorting.
src = ["engine"]
# Vendored via git subtree; linted upstream, kept byte-identical for clean subtree pulls.
extend-exclude = ["addons"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = [
    "S101", "S603", "S607",  # assert, subprocess, partial path
    "N806", "N803",  # X/y/X_train etc. are standard sklearn/numpy convention
    "S104",  # "0.0.0.0" is used as an invalid/missing-IP sentinel in
             # detection data throughout this codebase, never a socket bind
    "S108",  # "/tmp/", "/var/tmp/" etc. are detection-signal path prefixes
             # (flagging suspicious process activity), not insecure tempfile use
]

[tool.ruff.lint.per-file-ignores]
# Legacy detection-engine modules predate the lint config. They still carry long
# lines, commented-out code and best-effort `except: pass` blocks; these ignores
# are scoped to the files so new modules stay fully checked. Remove an entry
# once its module has been cleaned up.
"engine/anomaly_detector.py" = ["E501", "S110"]
"engine/datamanager.py" = ["E501"]
"engine/detection_methods.py" = ["E501", "S110", "S112"]
"engine/main.py" = ["E402", "E501", "S110"]  # E402: load_dotenv() must run before project imports
"engine/model_manager.py" = ["E501", "S112"]
"engine/visualizer.py" = ["E402", "E501"]
# Standalone tools that put engine/ on sys.path before importing project modules.
"engine/scripts/*" = ["E402", "E501", "S110"]
"engine/validation/*" = ["E402", "E501", "S110"]
# Documented CLI entry point; the hyphenated name is part of the interface.
"engine/mappings/template-install.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
# Make the engine's top-level modules (es_tls, config, ...) importable under bare `pytest`.
pythonpath = ["engine"]
python_files = ["test_*.py"]
addopts = "-x --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
